[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "co4-orchestrator"
version = "0.1.0a2"
description = "GitHub-first cooperative development governance and contributor-device orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Co4 contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "fastapi==0.128.2", "uvicorn==0.48.0", "SQLAlchemy==2.0.50",
  "httpx==0.28.1", "PyJWT==2.13.0", "cryptography==46.0.4", "pydantic==2.13.4"
]

[project.urls]
Homepage = "https://github.com/JerrettDavis/Co4"
Repository = "https://github.com/JerrettDavis/Co4"
Issues = "https://github.com/JerrettDavis/Co4/issues"
Documentation = "https://github.com/JerrettDavis/Co4#readme"
Changelog = "https://github.com/JerrettDavis/Co4/releases"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest==9.0.2", "pytest-bdd>=8.1,<9", "playwright>=1.50,<2"]
[project.scripts]
co4 = "co4.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
co4 = ["static/*"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
bdd_features_base_dir = "specs"
