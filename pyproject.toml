[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "co4-orchestrator"
version = "0.1.0a2"
description = "GitHub-first cooperative development governance and contributor-device orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Co4 contributors"}]
dependencies = [
  "fastapi==0.128.2", "uvicorn==0.48.0", "SQLAlchemy==2.0.50",
  "httpx==0.28.1", "PyJWT==2.13.0", "cryptography==46.0.4", "pydantic==2.13.4"
]
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest==9.0.2", "pytest-bdd>=8.1,<9", "playwright>=1.50,<2", "pytest-cov>=7.0,<8"]
lint = ["ruff==0.16.1", "mypy==1.20.2"]
[project.scripts]
co4 = "co4.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
co4 = ["static/*"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
bdd_features_base_dir = "specs"

[tool.ruff]
line-length = 100
target-version = "py311"
# Issue #11 scopes ruff (like the mypy config below) to the co4 package itself.
# tests/ and scripts/ are still reformatted opportunistically but not held to full
# lint enforcement in CI yet; that's a follow-up, not part of this pass.
extend-exclude = ["tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/co4"]
ignore_missing_imports = true
warn_unused_ignores = true
# No module-wide overrides: co4.app duck-types its GitHub client as
# `Any | DemoGitHub | GitHub` (see co4.github). Until that gets a real Protocol/base
# class (a separate refactor, out of scope for issue #11), the affected call sites
# carry per-line `# type: ignore[union-attr]` comments. warn_unused_ignores keeps
# those honest once the refactor lands.
