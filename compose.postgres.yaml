# Experimental overlay: not runtime-tested in the release environment.
services:
  co4:
    environment:
      CO4_DATABASE_URL: postgresql+psycopg://co4:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres/co4
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: co4
      POSTGRES_DB: co4
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - co4-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U co4 -d co4"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  co4-postgres:
