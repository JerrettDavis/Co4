name: Verify Co4
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: pytest -q --junitxml=test-results.xml --cov=co4 --cov-report=xml --cov-report=term-missing --cov-fail-under=72
      - run: python -m compileall -q src
      - run: python -m pip wheel --no-deps --wheel-dir dist .
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - name: Walk through the offline app
        run: |
          co4 demo --port 8765 --database sqlite:///./ci-demo.db > ci-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/wait_http.py http://localhost:8765/healthz
          python scripts/browser_smoke.py --url http://localhost:8765
      - name: Device-flow sign-in against co4 serve and a local GitHub stand-in
        if: ${{ !cancelled() }}  # independent of the demo walkthrough above; report both results
        # Starts its own `co4 serve` (loopback HTTP) plus a stdlib mock of github.com's device-flow
        # endpoints, then drives headless Chromium through the whole sign-in UI.
        run: python scripts/device_flow_e2e.py --output device-flow-e2e
